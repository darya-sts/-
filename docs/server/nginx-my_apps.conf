server {
    listen 80;
    listen [::]:80;
    server_name app1.neurosolutions.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app1.neurosolutions.pro;

    ssl_certificate /etc/letsencrypt/live/app1.neurosolutions.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app1.neurosolutions.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location /api/marvinbot/ {
        proxy_pass http://127.0.0.1:3001/api/marvinbot/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /bot-health {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
    }

    location = /marvin-health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_set_header Host 127.0.0.1;
    }


    # Agent memory MCP (Streamable HTTP)
    location /agent-memory/ {
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header Connection "";
        proxy_pass_header Mcp-Session-Id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
