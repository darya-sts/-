services:
  watchtower:
    image: nickfedor/watchtower:1.22.0
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --cleanup
      - --rolling-restart
      - --interval
      - "21600"
      - forge-postgres
      - forge-redis
