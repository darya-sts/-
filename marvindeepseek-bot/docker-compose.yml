services:
  marvindeepseek-bot:
    build: .
    container_name: marvindeepseek-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Host projects (override PROJECT_HOST_ROOT for local Cursor workspace)
      - ${PROJECT_HOST_ROOT:-/opt/my_services}:${PROJECT_HOST_ROOT:-/opt/my_services}:ro
    environment:
      ALLOWED_ROOTS: ${ALLOWED_ROOTS:-/opt/my_services}
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - agent-shared

networks:
  agent-shared:
    external: true
