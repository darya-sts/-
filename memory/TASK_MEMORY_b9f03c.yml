      ### FR-2. Взаимодействие с ИИ-агентами (черновик / требует подтверждения)
      - Сообщения пользователя так или иначе доходят до одного или нескольких ИИ-агентов, ответы агентов возвращаются в Telegram.
      - Не подтверждено: определение «агента», провайдер, число агентов, выбор агента, сохранение контекста, стриминг, инструменты/tools.

