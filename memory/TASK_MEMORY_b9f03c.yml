      ## Функциональные требования
      Все пункты ниже — **черновик / требует подтверждения**. Это гипотезы аналитика, извлечённые из формулировки «чат-бот в Telegram для взаимодействия с ИИ-агентами», а не принятые решения.

      ### FR-1. Канал взаимодействия — Telegram (черновик / требует подтверждения)
