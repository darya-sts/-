      - Не подтверждено: `/start`, `/help`, сброс диалога, кнопки, лимиты, обработка ошибок, вложения.

      ### FR-4. Сосуществование с текущим HTTP-сервисом (черновик / требует подтверждения)
      - Варианты (ни один не выбран): оставить `app/` как есть и добавить отдельный пакет бота; расширить текущий HTTP-сервис webhook-ами; заменить Hello-сервис ботом; вынести бота в другой репозиторий.
      - Решение постановщика обязательно до проектирования.

      ### Граничные случаи (черновик / требует подтверждения)
