      ## Обзор решения

      Минимальный HTTP/1.1 сервис на CPython 3.11+ только со стандартной библиотекой. Вся бизнес-логика живёт в чистой функции `handle_request(method, path, query) -> Response` без сокетов и без глобального состояния. `http.server.HTTPServer` + `BaseHTTPRequestHandler` — тонкая оболочка: разбор строки запроса, вызов handler, запись статус/заголовков/тела.

      Ключевые решения:
      - Пакет `app/` в корне репозитория, запуск `python -m app` (bind `127.0.0.1:8000` по умолчанию).
      - Юнит-тесты вызывают только `handle_request`, порт 8000 не занимают и сервер не поднимают.
      - JSON компактный (`separators=(",", ":")`, `ensure_ascii=False`), тела UTF-8, без лишних полей.
      - Однопоточный `HTTPServer`, ответы с `Connection: close`, чтобы не возиться с keep-alive.
      - Не трогать `.cursor/`, `memory/`, `orchestrator-protocol.md`. Заменить корневой README.md на документ продукта.

      ## Компоненты системы

      1. **`app.handler`** — маршрутизация и формирование ответов. Единственное место с правилами FR-2…FR-4 и лимитом имени (NFR-3). Не импортирует `http.server`.
      2. **`app.__main__`** — чтение `HOST`/`PORT`, создание `HTTPServer`, логирование, сигналы, строка `Serving on …`. Адаптер: `BaseHTTPRequestHandler` делегирует в `handle_request`.
      3. **`tests/test_handler.py`** — `unittest` против `handle_request`.
      4. **`README.md`** — описание продукта, запуск, curl, тесты.

      Зависимости: `__main__` → `handler`; `tests` → `handler`. Циклических зависимостей нет.

      ## Структуры данных

      ```python
      from dataclasses import dataclass

      @dataclass(frozen=True)
      class Response:
          status: int
          headers: dict[str, str]   # имя заголовка -> значение; порядок не важен
          body: bytes               # UTF-8 JSON, без завершающего \\n
      ```

      JSON-тела (и только эти ключи):
      - успех `/health`: `{"status":"ok"}`
      - успех `/hello`: `{"message":"Hello, <name>!"}`
      - ошибки: `{"error":"<code>"}`, где `<code>` один из `not found` | `method not allowed` | `name too long`

      Сериализация: `json.dumps(obj, ensure_ascii=False, separators=(",", ":")).encode("utf-8")`.

      Конфиг процесса (не dataclass, достаточно локальных переменных в `main`):
      - `host: str` — `os.environ.get("HOST", "127.0.0.1")`
      - `port: int` — `os.environ.get("PORT", "8000")` через `int(...)`; допустимый диапазон 1…65535. Иначе stderr и `sys.exit(1)`.

      Query `name`: после `urllib.parse.parse_qs(query, keep_blank_values=True)` взять первое значение списка `name` (уже URL-decoded, UTF-8). `str.strip()`. Пустое / только пробелы / ключ отсутствует → `"World"`. Длина в символах Python `len(name) > 256` → 400.

      ## API и интерфейсы

      ### Чистая функция (контракт для тестов и сервера)

      ```python
      def handle_request(method: str, path: str, query: str) -> Response:
          """
          method: HTTP-метод как в запросе, сравнение без учёта регистра (нормализовать .upper()).
          path: путь без query, как urlparse(...).path (например "/hello").
          query: raw query string без ведущего "?", может быть "".
          """
      ```

      Маршруты (путь сравнивать точно, без нормализации слэшей):

      | Условие | status | заголовки | тело |
      | --- | --- | --- | --- |
      | path `/health`, method GET | 200 | Content-Type, Content-Length | `{"status":"ok"}` |
      | path `/hello`, method GET, name ок | 200 | Content-Type, Content-Length | `{"message":"Hello, <name>!"}` |
      | path `/hello`, method GET, name > 256 символов | 400 | Content-Type, Content-Length | `{"error":"name too long"}` |
      | path `/health` или `/hello`, method не GET | 405 | Content-Type, Content-Length, Allow: GET | `{"error":"method not allowed"}` |
      | любой другой path (включая `/`, `/health/`, `/hello/`) | 404 | Content-Type, Content-Length | `{"error":"not found"}` |

      Обязательные заголовки каждого ответа:
      - `Content-Type: application/json; charset=utf-8`
      - `Content-Length: <len(body)>` (байты)
      - `Connection: close`
      - при 405 дополнительно `Allow: GET`

      Query на `/health` игнорируется. На `/hello` учитывается только первый `name`.

      Примеры (должны совпасть с тестами):
      - GET `/hello` query `` → `{"message":"Hello, World!"}`
      - GET `/hello` query `name=` → World
      - GET `/hello` query `name=Alice` → `{"message":"Hello, Alice!"}`
      - GET `/hello` query `name=%D0%9C%D0%B8%D1%80` → `{"message":"Hello, Мир!"}`
      - GET `/hello` query `name=%20` → World
      - GET `/hello` query `name=Alice&name=Bob` → Alice

      ### HTTP-сервер

      Класс-адаптер (имя на усмотрение, рекомендация `AppHandler(BaseHTTPRequestHandler)`):
      - `protocol_version = "HTTP/1.1"`
      - Для методов GET/POST/PUT/PATCH/DELETE/HEAD/OPTIONS (и при желании TRACE) один `_dispatch`, назначенный на `do_*`. Не оставлять дефолтный 501.
      - В `_dispatch`: `parsed = urllib.parse.urlparse(self.path)`; `resp = handle_request(self.command, parsed.path, parsed.query)`; записать status, headers, body через `send_response` / `send_header` / `end_headers` / `wfile.write`.
      - `log_request` / `log_message`: в stderr одна строка `METHOD PATH STATUS` (PATH без query). Не логировать query.
      - `server_version` / `sys_version` можно оставить дефолт или укоротить; на контракт JSON не влияет.

      Точка входа `python -m app`:
      1. Прочитать HOST/PORT; при невалидном PORT — сообщение в stderr (рекомендация: `Invalid PORT: ...`) и ненулевой код.
      2. `HTTPServer((host, port), AppHandler)` (не `ThreadingHTTPServer`).
      3. Одна строка в stdout: `Serving on http://{host}:{port}` (flush).
      4. `serve_forever()` до SIGINT/SIGTERM; затем `server_close()` и выход 0. SIGINT: KeyboardInterrupt. SIGTERM: `signal.signal(signal.SIGTERM, handler)` → `sys.exit(0)` или `server.shutdown()` из отдельного потока; достаточно `sys.exit(0)` после `server_close` в `finally`.

      Bind по умолчанию: host `127.0.0.1`, port `8000`.

      ## Технологический стек

      - Python 3.11+ (CPython). Аннотации `list`/`dict` без `from __future__`.
      - Только stdlib: `http.server`, `urllib.parse`, `json`, `os`, `sys`, `signal`, `dataclasses`, `unittest`.
      - Запрещено: pip, requirements.txt, venv как шаг, Flask/FastAPI/httpx, Docker, CI, линтеры как обязательная часть.
      - Почему `http.server`, а не `wsgiref`: прямой HTTP-адаптер, меньше слоёв; тесты всё равно не ходят в WSGI/сокет.

      ## Файловая структура

      ```
      README.md                 # заменить заглушку; только продукт
      app/
        __init__.py             # реэкспорт: handle_request, Response
        handler.py              # Response + handle_request + json helper
        __main__.py             # AppHandler, main(), env, сигналы
      tests/
        __init__.py             # пустой (допустим, не обязателен)
        test_handler.py         # unittest.TestCase
      ```

      Не создавать: `src/`, `requirements.txt`, `Makefile`, `pyproject.toml` (не нужны), не менять оркестраторные пути.

      ### Содержание модулей (для разработчика)

      **`app/handler.py`**
      - `JSON_CONTENT_TYPE = "application/json; charset=utf-8"`
      - `_json_response(status: int, payload: dict, extra_headers: dict | None = None) -> Response`
      - `handle_request` как выше. Внутренние хелперы `_hello_name(query: str) -> str | Response`: вернуть имя или сразу 400 Response.

      **`app/__main__.py`**
      - `def parse_bind() -> tuple[str, int]`
      - `class AppHandler(BaseHTTPRequestHandler)`
      - `def main() -> None` и `if __name__ == "__main__": main()` — при `python -m app` выполнится `main()`.

      **`tests/test_handler.py`** — минимум (все через `handle_request`, без `HTTPServer`):
      - GET `/health` → 200, JSON `status == "ok"`, Content-Type как в контракте
      - GET `/hello` без name → Hello, World!
      - GET `/hello` query `name=Alice` → Hello, Alice!
      - GET `/hello` пустой/пробельный name (`name=`, `name=%20`, `name=+++` если decode+strip даёт пусто) → World
      - неизвестный путь `/` и `/nope` → 404, `error == "not found"`
      - trailing slash `/health/`, `/hello/` → 404
      - POST (и хотя бы ещё один не-GET) на `/health` и `/hello` → 405, заголовок `Allow` содержит `GET`
      - Unicode: `name=%D0%9C%D0%B8%D1%80` → Hello, Мир!
      - name длиной 257 → 400 `name too long`; 256 → 200

      Проверка JSON в тестах: `json.loads(resp.body.decode("utf-8"))`. Дополнительно можно сравнить точные байты компактного JSON для `/health`.

      Запуск тестов (зафиксировать в README): `python -m unittest discover -s tests -v`

      **`README.md`** — разделы:
      1. Краткое описание (локальный Hello HTTP на stdlib).
      2. Требования: Python 3.11+, только стандартная библиотека, pip не нужен.
      3. Запуск: `python -m app`; HOST/PORT.
      4. Проверка: `curl -s http://127.0.0.1:8000/health` и `curl` для `/hello`, `/hello?name=Ada`.
      5. Тесты: команда discover выше.
      Не описывать оркестратор и skills.

      ## Открытые решения

      Разработчик может выбрать самостоятельно (рекомендации даны):
      - Имена класса handler и хелперов — не часть внешнего контракта.
      - Формат строки лога: рекомендация `{method} {path} {status}` в stderr; path без `?query`.
      - Текст stderr при плохом PORT: любой понятный, код выхода ≠ 0.
      - Пустой `tests/__init__.py` — по желанию; `discover -s tests` работает и без него, если файлы `test_*.py`.
      - Не писать интеграционный тест с ephemeral port в этом проходе (не требуется). Если добавят — только как дополнение, не вместо вызовов `handle_request`.

      Не оставлять на усмотрение: маршруты, коды, JSON-ключи, bind по умолчанию, точка входа `python -m app`, запрет pip.

      ## Критерий готовности реализации

      - `python -m unittest discover -s tests -v` зелёный на чистом Python 3.11+ без pip.
      - `python -m app` печатает `Serving on http://127.0.0.1:8000` и отвечает по контракту на GET `/health` и GET `/hello?name=Ada`.
      - Тесты не биндят порт 8000.
    status: done

