      ## Цель
      Инициализировать сейчас пустой репозиторий (кроме README.md и skills оркестратора) как минимальный рабочий HTTP-сервис на Python только со стандартной библиотекой. Сервис должен быть достаточно простым и воспроизводимым, чтобы Cloud Agents могли дальше разрабатывать и проверять код в этом репозитории без установки внешних пакетов.

      ## Функциональные требования

      ### FR-1. HTTP-сервис
      - Приложение — HTTP-сервер, запускаемый локально одной командой Python.
      - Только стандартная библиотека Python. Запрещены pip-зависимости, requirements.txt с пакетами, venv как обязательный шаг.
      - Слушает TCP-порт и обрабатывает HTTP/1.1 запросы.

      ### FR-2. GET /health — проверка живости
      - Метод: только GET.
      - Путь: точно `/health` (без завершающего слэша как канонический путь).
      - Query-параметры игнорируются.
      - Успешный ответ:
        - HTTP 200
        - Content-Type: application/json; charset=utf-8
        - Тело: `{"status":"ok"}`
      - Назначение: машинная проверка, что процесс жив и отвечает (liveness). Не ходит во внешние системы, не проверяет диск/БД.

      ### FR-3. GET /hello — приветствие
      - Метод: только GET.
      - Путь: точно `/hello`.
      - Query-параметр `name` (опциональный):
        - если `name` отсутствует, пустая строка после trim, или состоит только из пробелов — использовать значение `World`;
        - если передан — взять первое значение параметра, URL-decode (UTF-8), trim пробелов по краям;
        - при повторных `name=` использовать первое значение.
      - Успешный ответ:
        - HTTP 200
        - Content-Type: application/json; charset=utf-8
        - Тело: `{"message":"Hello, <name>!"}`, где `<name>` — выбранное имя, JSON-экранированное.
      - Примеры:
        - `GET /hello` → `{"message":"Hello, World!"}`
        - `GET /hello?name=` → `{"message":"Hello, World!"}`
        - `GET /hello?name=Alice` → `{"message":"Hello, Alice!"}`
        - `GET /hello?name=%D0%9C%D0%B8%D1%80` → `{"message":"Hello, Мир!"}`

      ### FR-4. Ошибки маршрутизации и методов
      - Неизвестный путь → HTTP 404, Content-Type: application/json; charset=utf-8, тело `{"error":"not found"}`.
      - Известный путь, но метод не GET (POST/PUT/PATCH/DELETE/HEAD/OPTIONS и т.д.) → HTTP 405, заголовок `Allow: GET`, тело `{"error":"method not allowed"}`.
      - Завершающий слэш (`/health/`, `/hello/`) считать неизвестным путём (404), чтобы контракт был однозначным.
      - Корневой путь `/` → 404 (отдельная главная страница не нужна).

      ### FR-5. Точка входа
      - Должна существовать команда локального запуска без дополнительных флагов по умолчанию (например `python -m app` или эквивалент, конкретный модуль выбирает архитектор).
      - По умолчанию bind: host `127.0.0.1`, port `8000`.
      - Переопределение через переменные окружения `HOST` и `PORT` (PORT — целое число). Некорректный PORT → ненулевой exit code и сообщение в stderr.
      - Процесс работает, пока не получит SIGINT/SIGTERM (Ctrl+C); при остановке — корректный выход.
      - При старте в stdout/stderr одна строка с фактическим адресом прослушивания, например `Serving on http://127.0.0.1:8000`.

      ### FR-6. Юнит-тесты
      - Фреймворк: `unittest` из стандартной библиотеки.
      - Запуск: `python -m unittest discover -s tests -v` (или эквивалент, зафиксированный в README) без сетевых внешних сервисов и без pip.
      - Покрыть как минимум:
        - GET /health → 200 и JSON `status=ok`;
        - GET /hello без name → Hello, World!;
        - GET /hello?name=Alice → Hello, Alice!;
        - GET /hello с пустым/пробельным name → World;
        - неизвестный путь → 404;
        - не-GET на /health и /hello → 405.
      - Тесты должны быть детерминированными и не зависеть от занятого порта 8000: предпочтительно тестировать handler/логику напрямую (или через ephemeral port), не требуя ручного запуска сервера.
      - Все тесты проходят на чистом Python без установки пакетов.

      ### FR-7. README
      - Заменить текущий заглушечный README.md на документ сервиса.
      - Обязательные разделы:
        - краткое описание;
        - требования: Python 3.11+, только stdlib;
        - запуск сервера;
        - проверка curl-ами GET /health и GET /hello (с name и без);
        - запуск тестов.
      - Не описывать оркестратор и skills — README про продукт.

      ### FR-8. Границы продукта (не делать)
      - Нет аутентификации, HTTPS, CORS, persistence, HTML UI, Docker, CI-конфигов, линтеров, type-checkers как обязательной части.
      - Не добавлять сторонние фреймворки (Flask/FastAPI/httpx и т.п.).
      - Не менять `.cursor/skills/`, `orchestrator-protocol.md`, `memory/` как часть продукта.

      ## Нефункциональные требования

      ### NFR-1. Стек
      - Язык: Python 3.11+ (CPython). Предполагаемая среда Cloud Agent уже содержит интерпретатор; pin конкретной микроверсии не требуется.
      - HTTP: stdlib (`http.server` и/или `wsgiref.simple_server` — выбор архитектора).
      - Кодировка: UTF-8 для тел ответов и разбора query.

      ### NFR-2. Производительность и нагрузка
      - Не задано. Достаточно однопоточного/однопроцессного сервера для локальной разработки и ручных проверок. Высокая нагрузка, keep-alive tuning и пулы не требуются.

      ### NFR-3. Безопасность
      - Аутентификация/авторизация не требуются (локальный dev-сервис).
      - Имя из query не исполняется как код; только подставляется в JSON-строку с корректным экранированием.
      - Ограничение длины `name`: если после decode длина > 256 символов — HTTP 400, тело `{"error":"name too long"}`.
      - Не логировать полный query на INFO по умолчанию (достаточно method+path).

      ### NFR-4. Наблюдаемость
      - Минимальные логи запросов в stderr: method, path, status code.
      - Health не требует метрик/tracing.

      ### NFR-5. Совместимость с Cloud Agents
      - Репозиторий после реализации должен позволять: клонировать/открыть workspace, запустить тесты одной командой, поднять сервер и проверить curl без `pip install`.
      - Структура каталогов должна быть очевидной (модуль приложения + `tests/`).
      - Не полагаться на Makefile/poetry/tox. Опциональный простой скрипт не обязателен.

      ### NFR-6. Качество кода
      - Читаемый код, без мёртвых абстракций.
      - Контракт JSON стабильный (ключи `status`, `message`, `error` как выше), без лишних полей.

      ## Открытые вопросы
      - Критических блокирующих вопросов нет. Ниже — принятые по умолчанию решения (не требуют ответа пользователя):
        - JSON, а не text/plain, для единообразия и простой машинной проверки.
        - Host 127.0.0.1:8000, override через HOST/PORT.
        - Python 3.11+.
        - Trailing slash = 404.
        - Лимит имени 256 символов.
        - HEAD не поддерживается отдельно (405), чтобы не усложнять минимальный сервис.

      ## Контекст для архитектора
      - Репозиторий сейчас пустой с точки зрения продукта: есть только заглушка README.md, git, skills оркестратора и memory/. Реализация должна добавить прикладной код, тесты и заменить README.
      - Не трогать оркестраторные файлы (`.cursor/`, `memory/`, `orchestrator-protocol.md`).
      - Предпочтительная раскладка (рекомендация, не жёсткое требование): пакет приложения в корне или `src/` + `tests/test_*.py` + точка входа `__main__.py`.
      - Handler лучше вынести из `do_GET` так, чтобы unittest вызывал чистую функцию `(method, path, query) -> (status, headers, body)` без сокета.
      - Архитектура должна быть реализуема одним разработчиком за один проход: 1–2 модуля приложения, 1 файл тестов, README.
      - Критерий готовности продукта: `python -m unittest discover -s tests -v` зелёный; вручную `GET /health` и `GET /hello?name=Ada` соответствуют контракту выше.
